name: AI service CI

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          grep -vE '^(torch|transformers|accelerate)==' requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          grep -vE '^-r ' requirements-dev.txt >> "$RUNNER_TEMP/requirements-ci.txt"
          python -m pip install --upgrade pip
          python -m pip install -r "$RUNNER_TEMP/requirements-ci.txt"

      - name: Lint (blocking)
        run: ruff check --select E9,F821 .

      - name: Lint (report)
        continue-on-error: true
        run: ruff check --statistics .

      - name: Prepare training data
        run: python -m training.prepare_dataset

      - name: Run tests
        run: python -m pytest -q
