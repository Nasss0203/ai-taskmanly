name: AI service CI

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      APP_ENV: test
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          grep -vE '^(torch|transformers|accelerate)==' requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          grep -vE '^-r ' requirements-dev.txt >> "$RUNNER_TEMP/requirements-ci.txt"
          python -m pip install --upgrade pip
          python -m pip install -r "$RUNNER_TEMP/requirements-ci.txt"

      - name: Lint
        run: ruff check .

      - name: Audit dependencies
        continue-on-error: true
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --no-deps --disable-pip

      - name: Prepare training data
        run: python -m training.prepare_dataset

      - name: Run tests
        run: python -m pytest -q
