name: AI service CI

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      APP_ENV: test
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip freeze > "$RUNNER_TEMP/installed.txt"
          python -m pip install pip-audit==2.10.1

      - name: Audit installed environment
        run: pip-audit -r "$RUNNER_TEMP/installed.txt" --no-deps --disable-pip

      - name: Lint
        run: ruff check .

      - name: Audit pinned requirements
        run: pip-audit -r requirements.txt -r requirements-dev.txt -r requirements-qwen.txt --no-deps --disable-pip

      - name: Prepare training data
        run: python -m training.prepare_dataset

      - name: Run tests
        run: python -m pytest -q
